# Information generator (which expects this key), not because CS2 has a
# separate "working" rhythm distinct from its official one.
instructional_working_cadence:
  days: "Monday / Wednesday / Friday"
  time: "1:00 PM"
  label: "Same as the official Banner meeting time above -- no separate planning cadence for this course."

