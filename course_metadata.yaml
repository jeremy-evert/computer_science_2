  catalog_offering_note: "Traditional, in-person section"

# Official Banner/catalog facts, preserved verbatim.
official:
  modality: "Traditional (in-person)"
  location: "Gen. Thomas P. Stafford Center, Room 259"
  meeting_pattern: "M/W/F 1:00 PM - 1:50 PM"
  catalog_description: >-
    This course is a continuation of Computer Science I. Object-oriented
    programming concepts such as class inheritance, encapsulation and
    polymorphism are covered. Topics covered include abstract classes;
    interfaces; GUI programming, event-driven programming, data
    abstraction through use of classic data structures list, stack and
    queue, and object-oriented thinking and design. Emphasis will be on
    program design, modularity, debugging, and documentation. Source code
    management is practiced in paired programming projects.

